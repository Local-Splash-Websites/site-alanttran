services:
  web:
    image: localsplash/site-alanttran:${IMAGE_TAG:-latest}
    container_name: site-alanttran
    environment:
      SITE_NAME: ${SITE_NAME:-Alan T. Tran, M.D.}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TLS: ${SMTP_TLS:-on}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-on}
    ports:
      - "${HOST_PORT:-8090}:80"
    restart: unless-stopped
